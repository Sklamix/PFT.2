pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Patched transitive versions within the existing major ranges.
# Technical justification: all four are build/dev-path packages, and the chosen
# versions are the first patched releases for their advisories.
overrides:
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  qs@>=6.7.0 <=6.16.0: 6.17.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  ip-address@<=10.7.3: 10.7.6

allowBuilds:
  # Neither package needs lifecycle scripts at runtime; their install scripts are
  # no-ops/messages. Explicitly denying them keeps `pnpm install` deterministic.
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: false
